services:
  - type: web
    name: echoline-game-server
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: game-server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_API_URL
        value: https://echoline.eduiraq.net/admin/api.php
      - key: ADMIN_API_KEY
        value: ""
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_ROOMS
        value: "100"
      - key: MAX_PLAYERS_PER_ROOM
        value: "4"
      - key: MATCH_DURATION_SECONDS
        value: "600"
      - key: DISCONNECT_GRACE_SECONDS
        value: "30"
      - key: LOG_LEVEL
        value: info
      - key: USE_REDIS
        value: "false"