<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#04060B"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Outer diamond ring -->
  <polygon points="256,32 480,256 256,480 32,256" fill="none" stroke="url(#g)" stroke-width="6"/>

  <!-- Inner diamond -->
  <polygon points="256,80 432,256 256,432 80,256" fill="url(#g)" opacity="0.18"/>

  <!-- Echo concentric rings -->
  <polygon points="256,128 384,256 256,384 128,256" fill="none" stroke="#D4AF37" stroke-width="3" opacity="0.7"/>
  <polygon points="256,176 336,256 256,336 176,256" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.6"/>
  <polygon points="256,224 288,256 256,288 224,256" fill="#D4AF37"/>

  <!-- Title text -->
  <text x="256" y="262" font-family="Arial Black,sans-serif" font-size="32" font-weight="900" fill="#04060B" text-anchor="middle">E//L</text>

  <!-- Brand subtitle -->
  <text x="256" y="492" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#00E5FF" text-anchor="middle" letter-spacing="6">ECHO//LINE</text>
</svg>