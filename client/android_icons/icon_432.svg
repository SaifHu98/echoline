    <text x="256" y="478" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">ECHO//LINE</text>
    <line x1="180" y1="494" x2="332" y2="494" stroke="url(#presentGrad)" stroke-width="2" opacity="0.8"/>
  </g>
