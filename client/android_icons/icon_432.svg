<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#0F1626"/>
      <stop offset="0.6" stop-color="#070B14"/>
      <stop offset="1" stop-color="#02030A"/>
    </radialGradient>
    <linearGradient id="pastGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#0099CC"/>
    </linearGradient>
    <linearGradient id="presentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD86B"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="futureGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4FBF"/>
      <stop offset="1" stop-color="#B83A8A"/>
    </linearGradient>
    <radialGradient id="echoGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>
  <g clip-path="url(#iconClip)">
    <rect width="512" height="512" fill="url(#bgGrad)"/>
    <g opacity="0.06" stroke="#00E5FF" stroke-width="0.5">
      <line x1="0" y1="64" x2="512" y2="64"/>
      <line x1="0" y1="128" x2="512" y2="128"/>
      <line x1="0" y1="192" x2="512" y2="192"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
      <line x1="0" y1="320" x2="512" y2="320"/>
      <line x1="0" y1="384" x2="512" y2="384"/>
      <line x1="0" y1="448" x2="512" y2="448"/>
      <line x1="64" y1="0" x2="64" y2="512"/>
      <line x1="128" y1="0" x2="128" y2="512"/>
      <line x1="192" y1="0" x2="192" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="320" y1="0" x2="320" y2="512"/>
      <line x1="384" y1="0" x2="384" y2="512"/>
      <line x1="448" y1="0" x2="448" y2="512"/>
    </g>
    <circle cx="256" cy="256" r="210" fill="none" stroke="#1A2438" stroke-width="2"/>
    <g filter="url(#softGlow)">
      <path d="M 100 256 A 156 156 0 0 1 412 256" fill="none" stroke="url(#pastGrad)" stroke-width="14" stroke-linecap="round"/>
    </g>
    <g filter="url(#softGlow)">
      <path d="M 256 100 A 156 156 0 0 1 256 412" fill="none" stroke="url(#presentGrad)" stroke-width="14" stroke-linecap="round"/>
    </g>
    <g filter="url(#softGlow)">
      <path d="M 412 256 A 156 156 0 0 1 100 256" fill="none" stroke="url(#futureGrad)" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
    </g>
    <circle cx="256" cy="256" r="48" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.4"/>
    <circle cx="256" cy="256" r="64" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.3"/>
    <circle cx="256" cy="256" r="80" fill="none" stroke="#FF4FBF" stroke-width="1" opacity="0.25"/>
    <circle cx="256" cy="256" r="40" fill="url(#echoGlow)" filter="url(#strongGlow)"/>
    <circle cx="256" cy="256" r="22" fill="#FFFFFF"/>
    <circle cx="256" cy="256" r="14" fill="#00E5FF"/>
    <g fill="#00E5FF" filter="url(#softGlow)">
